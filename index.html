<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ehab Gamal — Video Editor</title>
<meta name="description" content="Video editor crafting high-performing content for real estate and healthcare brands across the UAE and Gulf region.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0E11;
    --bg-elevated:#18181C;
    --bg4:#18181C;
    --line:rgba(245,245,247,0.09);
    --line2:rgba(245,245,247,0.16);
    --text:#F5F5F7;
    --muted:rgba(245,245,247,0.55);
    --accent:#E2E8F0;
    --mint:#10B981;
    --mint-glow:rgba(16,185,129,0.38);
    --accent-dim:rgba(226,232,240,0.09);
    --accent-glow:rgba(226,232,240,0.26);
    --brown:#10B981;
    --brown2:#34D399;
    --brown-dim:rgba(16,185,129,0.16);
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; overflow-x:hidden;
    cursor:none;
  }
  button{cursor:none;}
  @media(hover:none),(pointer:coarse){
    body,button{cursor:auto;}
    .cursor-outer,.cursor-inner{display:none!important;}
  }
  ::selection{background:var(--accent); color:#0E0E11;}
  a{color:inherit;}

  /* custom cursor */
  .cursor-outer{
    position:fixed; top:0; left:0; width:38px; height:38px; border-radius:50%;
    border:1.5px solid rgba(245,245,247,0.5); pointer-events:none; z-index:9998;
    transform:translate(-50%,-50%);
    transition:width .25s var(--ease),height .25s var(--ease),border-color .25s,background .25s;
  }
  .cursor-inner{
    position:fixed; top:0; left:0; width:7px; height:7px; border-radius:50%;
    background:var(--accent); pointer-events:none; z-index:9999; transform:translate(-50%,-50%);
    transition:width .12s,height .12s,background .2s;
  }
  body.ch .cursor-outer{width:54px; height:54px; border-color:var(--brown2); background:var(--brown-dim);}
  body.ch .cursor-inner{width:4px; height:4px; background:var(--brown2);}
  body.cc .cursor-outer{width:24px; height:24px;}

  /* starfield */
  #starCanvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0;}

  /* scroll reveal */
  .reveal{opacity:0; transform:translateY(26px); transition:opacity .8s var(--ease), transform .8s var(--ease);}
  .reveal.in{opacity:1; transform:translateY(0);}

  /* scroll progress bar — the timeline scrubber */
  #scrub{position:fixed; top:0; left:0; height:2px; width:0%; z-index:999; transition:width .05s linear;
    background:linear-gradient(90deg,var(--brown),var(--accent)); box-shadow:0 0 8px var(--accent-glow);}

  /* floating ambient videos */
  .floating-video{
    position:absolute; z-index:1; pointer-events:none;
    width:190px; height:190px; border-radius:50%; overflow:hidden;
    border:1px solid var(--line2);
    box-shadow:0 0 26px rgba(226,232,240,0.20), 0 10px 34px rgba(0,0,0,0.55);
    opacity:0.88; animation:floatDrift 8s ease-in-out infinite;
    will-change:transform;
  }
  .floating-video video{width:100%; height:100%; object-fit:cover; display:block;}
  .floating-video::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    box-shadow:inset 0 0 22px rgba(0,0,0,0.45); pointer-events:none;
  }
  @keyframes floatDrift{
    0%,100%{transform:translateY(0) rotate(-1.5deg);}
    50%{transform:translateY(-20px) rotate(1.5deg);}
  }
  @media(max-width:900px){ .floating-video{display:none;} }

  /* abstract copper gradient background */
  .gold-abstract{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 55% 40% at 12% 15%, rgba(16,185,129,0.07), transparent 62%),
      radial-gradient(ellipse 50% 45% at 88% 10%, rgba(226,232,240,0.05), transparent 65%),
      radial-gradient(ellipse 60% 50% at 20% 55%, rgba(226,232,240,0.05), transparent 60%),
      radial-gradient(ellipse 50% 45% at 92% 60%, rgba(226,232,240,0.06), transparent 65%),
      radial-gradient(ellipse 55% 45% at 15% 95%, rgba(226,232,240,0.05), transparent 62%),
      radial-gradient(ellipse 45% 40% at 85% 92%, rgba(226,232,240,0.04), transparent 60%);
    filter:blur(50px);
  }

  /* word glow on hover-stop */
  .glow-word{transition:text-shadow .3s ease, color .3s ease;}
  .glow-word.glow-active{
    color:var(--accent);
    text-shadow:0 0 10px var(--accent-glow), 0 0 24px var(--accent-glow);
  }

  .eyebrow{
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.12em; font-weight:600;
    color:var(--accent); text-transform:uppercase; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:'▸'; font-size:10px;}

  h1,h2,h3{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; font-weight:700; line-height:1;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  section{padding:110px 0;}
  @media(max-width:720px){ section{padding:70px 0;} }

  /* NAV */
  nav{
    position:fixed; top:0; left:0; width:100%; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 32px; background:linear-gradient(to bottom, rgba(14,14,17,0.92), transparent);
  }
  .nav-logo{font-family:'Space Grotesk',sans-serif; font-size:26px; letter-spacing:0.04em;}
  .nav-links{display:none; gap:28px; font-size:13px; text-transform:uppercase; letter-spacing:0.08em;}
  .nav-links a{text-decoration:none; color:var(--muted); transition:color .2s;}
  .nav-links a:hover{color:var(--text);}
  @media(min-width:900px){ .nav-links{display:flex;} }
  .nav-cta{
    font-size:12px; text-transform:uppercase; letter-spacing:0.08em; text-decoration:none;
    border:1px solid var(--line); padding:10px 18px; border-radius:2px; color:var(--text);
    transition:all .2s; white-space:nowrap;
  }
  .nav-cta:hover{border-color:var(--accent); color:var(--accent);}

  /* HERO */
  .hero{
    min-height:100svh; display:flex; flex-direction:column; justify-content:center;
    position:relative; padding-top:100px;
  }
  .hero::after{
    content:''; position:absolute; inset:0; z-index:-1;
    background:radial-gradient(ellipse 60% 50% at 75% 20%, var(--accent-dim), transparent 60%);
  }
  .hero-eyebrow{margin-bottom:22px;}
  .hero h1{font-size:clamp(64px,13vw,150px); text-transform:uppercase;}
  .hero h1 .last{color:var(--accent);}
  .hero-desc{
    max-width:520px; color:var(--muted); font-size:17px; line-height:1.6; margin:28px 0 40px;
  }
  .hero-stat{font-family:'Inter',sans-serif; letter-spacing:0.06em; font-size:13px; color:var(--muted); margin-bottom:36px;}
  .hero-stat b{color:var(--text); font-size:15px;}
  .hero-actions{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:56px;}
  .stats-row{display:flex; align-items:center; gap:28px; flex-wrap:wrap;}
  .stat-box strong{font-family:'Space Grotesk',sans-serif; font-size:clamp(28px,4vw,40px); color:var(--text); font-weight:700;}
  .stat-box span{font-family:'Space Grotesk',sans-serif; font-size:clamp(20px,3vw,28px); color:var(--accent); font-weight:700;}
  .stat-box p{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px;}
  .stat-div{width:1px; height:38px; background:var(--line2);}
  @media(max-width:720px){ .stat-div{display:none;} .stats-row{gap:28px 40px;} }
  .btn-primary, .btn-outline{
    font-size:13px; text-transform:uppercase; letter-spacing:0.08em; text-decoration:none;
    padding:16px 30px; border-radius:2px; transition:all .2s; display:inline-block;
  }
  .btn-primary{background:var(--accent); color:#0E0E11; font-weight:600;}
  .btn-primary:hover{background:#FFFFFF;}
  .btn-outline{border:1px solid var(--line); color:var(--text);}
  .btn-outline:hover{border-color:var(--accent); color:var(--accent);}
  .scroll-hint{
    position:absolute; bottom:36px; left:24px; font-family:'Inter',sans-serif; letter-spacing:0.06em;
    font-size:11px; color:var(--muted); letter-spacing:0.08em;
  }

  /* SECTION HEAD */
  .sec-head{margin-bottom:56px;}
  .sec-head h2{font-size:clamp(38px,6vw,64px); text-transform:uppercase; margin-top:14px;}
  .sec-head p{color:var(--muted); max-width:520px; margin-top:16px; font-size:15px; line-height:1.6;}

  /* FILTER TABS */
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:36px;}
  .filter-btn{
    font-family:'Inter',sans-serif; letter-spacing:0.06em; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
    background:none; border:1px solid var(--
